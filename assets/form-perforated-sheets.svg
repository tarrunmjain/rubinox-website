<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="933" viewBox="0 0 1400 933" role="img" aria-labelledby="title desc">
  <title id="title">Stainless steel perforated sheets</title>
  <desc id="desc">Premium industrial illustration of stainless steel perforated sheets with round hole patterns and Rubinox navy, silver and gold styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.6" stop-color="#132a63"/>
      <stop offset="1" stop-color="#d9dee7"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#ccd5e3"/>
      <stop offset="0.68" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#8e9bb0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7890"/>
      <stop offset="1" stop-color="#cbd4e1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c65b"/>
      <stop offset="1" stop-color="#e2a02f"/>
