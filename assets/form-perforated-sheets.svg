    <clipPath id="panelClip"><path d="M224 162h808l154 122v430H224z"/></clipPath>
  </defs>
  <rect width="1400" height="933" fill="url(#bg)"/>
  <circle cx="1120" cy="160" r="150" fill="#f7c65b" opacity="0.13"/>
  <circle cx="232" cy="790" r="155" fill="#f8fafc" opacity="0.11"/>
  <path d="M0 720c180-70 351-65 512-18 225 66 429 40 613-35 102-42 190-36 275 8v258H0z" fill="#f8fafc" opacity="0.08"/>
